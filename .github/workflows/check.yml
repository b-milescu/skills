name: check

on:
  pull_request:
  push:
    branches: [main]
    tags: ["**"]

permissions:
  contents: read

jobs:
  check:
    # ubuntu-latest: tests/agent-check.sh needs GNU find (-printf).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
