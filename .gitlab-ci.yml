image: node:22

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'

stages:
  - validate

variables:
  AUTO_DEVOPS_DISABLED: "true"
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

check:
  stage: validate
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  script:
    - npm ci
    - npm run check
